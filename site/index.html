  <style>
    
    :root {
      color-scheme: light dark;
      --white: #fffdf7;
      --gold: #f4dd95;
      --red: #d74438;
      --focus: #f0cb63;
      --button: rgba(4, 20, 17, .52);
      --button-border: rgba(255, 255, 255, .52);
      --hairline: rgba(255, 255, 255, .24);
      --muted: rgba(255, 255, 255, .68);
      --deep: #071b18;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --white: #fffdf7;
        --gold: #f4dd95;
        --red: #ef665b;
        --focus: #f3d87e;
        --button: rgba(0, 11, 9, .68);
        --button-border: rgba(255, 255, 255, .45);
      }
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: #081f1b;
      color: var(--white);
      font-family: "Noto Sans KR", sans-serif;
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      opacity: .045;
      mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");
    }

    .frame {
      position: fixed;
      inset: clamp(18px, 2.2vw, 34px);
      z-index: 7;
      pointer-events: none;
      border: 1px solid var(--hairline);
      clip-path: polygon(0 0, 16% 0, 16% 1px, 84% 1px, 84% 0, 100% 0, 100% 100%, 84% 100%, 84% calc(100% - 1px), 16% calc(100% - 1px), 16% 100%, 0 100%);
      opacity: 0;
      animation: frameIn 1.4s .85s ease-out forwards;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      border-top: 1px solid var(--gold);
    }
    .frame::before { top: -1px; left: -1px; border-left: 1px solid var(--gold); }
    .frame::after { right: -1px; bottom: -1px; border-right: 1px solid var(--gold); border-top: 0; border-bottom: 1px solid var(--gold); }

    .ambient {
      position: fixed;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at calc(69% + var(--px, 0px)) calc(43% + var(--py, 0px)), rgba(244, 221, 149, .11), transparent 18%),
        linear-gradient(112deg, transparent 38%, rgba(255,255,255,.045) 48%, transparent 60%);
      mix-blend-mode: screen;
      animation: ambientSweep 9s ease-in-out infinite alternate;
    }

    .hero {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

      color: rgba(255,255,255,.54);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .32em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: translateY(-50%);
      opacity: 0;
      animation: detailIn .8s 1.35s ease-out forwards;
    }

    .controls {
      position: fixed;
      top: max(15px, env(safe-area-inset-top));
      right: max(15px, env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      gap: 8px;
    }

    .control {
      min-height: 40px;
      border: 1px solid var(--button-border);
      border-radius: 999px;
      padding: 9px 13px;
      background: var(--button);
      color: #fff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font: 700 12px "Noto Sans KR", sans-serif;
      cursor: pointer;
    }

    .control:hover { background: rgba(4, 20, 17, .72); }
    .control:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .hero-inner {
      position: relative;
      z-index: 2;
      width: min(1240px, calc(100% - 96px));
      min-height: 100svh;
      padding: clamp(74px, 9.5vh, 108px) 0 max(58px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
    }

    .school-mark {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 18px;
      width: min(620px, 72vw);
      margin-bottom: clamp(44px, 7.5vh, 82px);
      opacity: 0;
      transform: translate3d(-22px, 8px, 0);
      animation: markIn .9s .12s cubic-bezier(.16, .86, .28, 1) forwards;
    }

    .school-mark::after {
      content: "";
      position: absolute;
      left: clamp(76px, 7vw, 96px);
      right: 0;
      bottom: -16px;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,.76), rgba(255,255,255,.08));
      transform: scaleX(0);
      transform-origin: left;
      animation: draw .9s .58s cubic-bezier(.2, .75, .18, 1) forwards;
    }

    .school-mark img {
      width: clamp(58px, 5.5vw, 76px);
      height: clamp(58px, 5.5vw, 76px);
      object-fit: contain;
      filter: drop-shadow(0 5px 12px rgba(0, 0, 0, .2));
      animation: crestSettle 1.1s .1s cubic-bezier(.16, .86, .28, 1) both;
    }

    .motto {
      font-family: "Gowun Batang", serif;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.35;
      white-space: nowrap;
      text-shadow: 0 2px 10px rgba(0, 0, 0, .32);
    }

    h1 {
      position: relative;
      max-width: 1160px;
      margin: 0;
      font-family: "Gowun Batang", serif;
      font-size: clamp(66px, 8.75vw, 126px);
      font-weight: 700;
      letter-spacing: -.075em;
      line-height: .88;
      text-shadow: 0 5px 34px rgba(0, 0, 0, .34);
    }

    h1::before {
      content: "";
      position: absolute;
      left: -28px;
      top: .16em;
      width: 2px;
      height: 0;
      background: linear-gradient(180deg, var(--gold), rgba(244,221,149,.08));
      animation: titleRail 1s 1.05s cubic-bezier(.2, .75, .18, 1) forwards;
    }

    h1::after {
      content: "";
      position: absolute;
      z-index: -1;
      left: -3.2vw;
      top: -2vw;
      width: min(74vw, 840px);
      height: calc(100% + 4vw);
      background: radial-gradient(ellipse at 28% 50%, rgba(4,18,16,.35), transparent 70%);
      pointer-events: none;
    }

    .line {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow: hidden;
      padding: .08em .09em .1em 0;
    }

    .line:first-child { animation: titleDrift 7.5s 1.7s ease-in-out infinite alternate; }
    .line:nth-child(2) {
      color: var(--white);
      padding-left: .62em;
      animation: titleDrift 8.5s 2.1s ease-in-out infinite alternate-reverse;
    }

    .word {
      display: inline-block;
      transform: translate3d(0, 118%, 0) skewY(3deg);
      transform-origin: left bottom;
      filter: blur(10px);
      opacity: 0;
      animation: rise 1.3s .45s cubic-bezier(.16, .86, .28, 1) forwards;
    }

    .line:nth-child(2) .word { animation-delay: .67s; }

    .school-name {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: clamp(28px, 4vh, 42px);
      padding-left: 1px;
      color: rgba(255, 255, 255, .86);
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 700;
      letter-spacing: .2em;
      line-height: 1.5;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(10px);
      animation: detailIn .8s 1.12s ease-out forwards;
    }

    .school-name::after {
      content: "";
      width: 7px;
      height: 7px;
      border: 1px solid rgba(244,221,149,.66);
      transform: rotate(45deg);
      margin-left: 2px;
    }

    .school-name::before {
      content: "";
      width: 38px;
      height: 2px;
      background: var(--gold);
    }

    .baseline {
      position: absolute;
      left: 0;
      bottom: max(32px, env(safe-area-inset-bottom));
      width: min(520px, 48vw);
      height: 1px;
      overflow: hidden;
      background: linear-gradient(90deg, rgba(255,255,255,.62), rgba(255,255,255,.12) 75%, transparent);
      transform: scaleX(0);
      transform-origin: left;
      animation: draw 1.3s 1s cubic-bezier(.2, .75, .18, 1) forwards;
    }

    .baseline::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 34%;
      background: linear-gradient(90deg, transparent, #fff, transparent);
      transform: translateX(-120%);
      animation: lineGlint 4.8s 2.4s ease-in-out infinite;
    }


    .enter-row {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 22px;
      margin-top: clamp(30px, 5vh, 52px);
      opacity: 0;
      transform: translateY(12px);
      animation: detailIn .9s 1.55s cubic-bezier(.16, .86, .28, 1) forwards;
    }

    .enter {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 52px;
      padding: 0 26px 0 28px;
      border: 1px solid rgba(244, 221, 149, .7);
      border-radius: 999px;
      background: rgba(244, 221, 149, .12);
      color: var(--white);
      font: 700 15px "Noto Sans KR", sans-serif;
      letter-spacing: .02em;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background-color .25s ease, color .25s ease, border-color .25s ease, transform .25s ease;
    }

    .enter .arrow { display: inline-block; transition: transform .25s ease; }
    .enter:hover, .enter:focus-visible { background: var(--gold); border-color: var(--gold); color: #12261f; }
    .enter:hover .arrow, .enter:focus-visible .arrow { transform: translateX(5px); }
    .enter:focus-visible, .enter-alt:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

    .enter-alt {
      color: rgba(255, 255, 255, .78);
      font-size: 13px;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-color: rgba(255, 255, 255, .36);
    }
    .enter-alt:hover { color: #fff; text-decoration-color: var(--gold); }

    @media (max-width: 700px) {
      .enter { width: 100%; justify-content: center; min-height: 54px; }
      .enter-row { gap: 12px; }
      .enter-alt { margin-inline: auto; }
    }


    .paused *, .paused *::before, .paused *::after { animation-play-state: paused !important; }

    @keyframes frameIn {
      from { opacity: 0; transform: scale(.985); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes ambientSweep {
      from { opacity: .55; transform: translate3d(-1.5%, 0, 0); }
      to { opacity: 1; transform: translate3d(1.5%, 0, 0); }
    }
    @keyframes titleRail {
      to { height: 1.22em; }
    }
    @keyframes rise {
      55% { filter: blur(0); }
      to { transform: translate3d(0, 0, 0) skewY(0); filter: blur(0); opacity: 1; }
    }
    @keyframes markIn {
      to { transform: translate3d(0, 0, 0); opacity: 1; }
    }
    @keyframes crestSettle {
      from { transform: scale(.72) rotate(-9deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes draw {
      to { transform: scaleX(1); }
    }
    @keyframes camera {
      0% { transform: scale(1.04) translate3d(0, 0, 0); }
      42% { transform: scale(1.09) translate3d(-1.1%, .6%, 0); }
      100% { transform: scale(1.13) translate3d(-2%, 1.1%, 0); }
    }
    @keyframes titleDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(0, -5px, 0); }
    }
    @keyframes detailIn {
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes lineGlint {
      0%, 28% { transform: translateX(-120%); opacity: 0; }
      46% { opacity: .85; }
      68%, 100% { transform: translateX(360%); opacity: 0; }
    }

    @media (max-width: 700px) {
      .hero::after {
        background:
          linear-gradient(90deg, rgba(3, 16, 13, .28), transparent 82%),
          linear-gradient(180deg, rgba(4, 18, 16, .4), rgba(4, 22, 18, .7) 70%, #071b18);
      }
      .hero-inner {
        width: min(100% - 46px, 560px);
        padding-top: max(96px, 12vh);
        justify-content: flex-start;
      }
      .frame { inset: 12px; }
      .side-type { display: none; }
      .school-mark {
        width: min(100% - 12px, 430px);
        gap: 13px;
        margin-bottom: clamp(38px, 7vh, 60px);
      }
      .school-mark::after { left: 75px; }
      .school-mark img { width: 62px; height: 62px; }
      .motto { font-size: clamp(14px, 4vw, 18px); }
      h1 { font-size: clamp(54px, 16.5vw, 80px); line-height: .9; }
      h1::before { left: -13px; width: 1px; }
      .line:nth-child(2) { padding-left: .36em; }
      .school-name { max-width: 310px; letter-spacing: .12em; }
      .baseline { width: min(58vw, 300px); }
      .controls { top: max(12px, env(safe-area-inset-top)); right: 12px; }
      .control { min-height: 38px; padding: 8px 11px; }
    }

    @media (max-width: 380px) {
      .controls { gap: 6px; }
      .control { padding: 8px 10px; font-size: 11px; }
      .school-name { font-size: 9px; }
      h1 { font-size: clamp(52px, 16.8vw, 64px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
      .word, .school-mark { transform: none; opacity: 1; }
      .baseline { transform: scaleX(1); }
    }

    /* short screens (landscape phones) - must come after the original max-width rules */
    @media (max-height: 520px) {
      .hero-inner { padding-top: 54px; padding-bottom: 36px; }
      .school-mark { margin-bottom: 16px; }
      h1 { font-size: clamp(38px, 12.5vh, 72px); line-height: .9; }
      .school-name { margin-top: 14px; }
      .enter-row { margin-top: 16px; flex-wrap: nowrap; }
      .enter { width: auto; min-height: 44px; padding: 0 22px; }
      .enter-alt { margin-inline: 0; white-space: nowrap; }
      .baseline { display: none; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>
  <div class="controls" aria-label="모션 제어">
    <button class="control" id="motion" type="button" aria-pressed="false">움직임 멈춤</button>
    <button class="control" id="replay" type="button">다시 재생</button>
  </div>

  <main>

      // Phones: primary button opens the mobile edition, the small link the web edition.
      function route() {
        var enter = document.getElementById('enter');
        var alt = document.getElementById('enter-alt');
        var phone = window.matchMedia('(max-width: 760px)').matches;
        enter.setAttribute('href', phone ? 'm/' : 'app/');
        alt.setAttribute('href', phone ? 'app/' : 'm/');
        alt.textContent = phone ? '웹 버전으로 보기' : '모바일 버전으로 보기';
      }
      route();
      window.matchMedia('(max-width: 760px)').addEventListener('change', route);

      if (!reduceMotion) {
        heroSurface.addEventListener('pointermove', function (event) {
          var x = (event.clientX / window.innerWidth - .5);
          var y = (event.clientY / window.innerHeight - .5);
          document.documentElement.style.setProperty('--px', (x * 18).toFixed(1) + 'px');
          document.documentElement.style.setProperty('--py', (y * 14).toFixed(1) + 'px');
        });
      }

      motion.addEventListener('click', function () {
        var paused = root.classList.toggle('paused');
        motion.textContent = paused ? '움직임 재생' : '움직임 멈춤';
        motion.setAttribute('aria-pressed', String(paused));
      });

      replay.addEventListener('click', function () {
        root.classList.remove('paused');
        motion.textContent = '움직임 멈춤';
        motion.setAttribute('aria-pressed', 'false');
        var replacement = hero.cloneNode(true);
        hero.parentNode.replaceChild(replacement, hero);
        hero = replacement;
      });
    })();
  </script>
</body>
</html>
